syntax = "proto3";

option java_package = "com.mcdiamondfire.modapi.messages.common";
option java_multiple_files = true;

// Represents a cuboid region in the world.
message ApiRegion {
  APILocation min = 1;
  APILocation max = 2;
}

// Represents a location.
message APILocation {
  double x = 1;
  double y = 2;
  double z = 3;
  float pitch = 4;
  float yaw = 5;
}
