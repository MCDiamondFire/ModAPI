syntax = "proto3";

option java_package = "com.mcdiamondfire.modapi.messages.common";
option java_multiple_files = true;

// Represents information about the server.
message ServerInfo {
  // Represents a server type.
  enum DFServerType {
    MAIN = 0;
    BETA = 1;
    DEV = 2;
    PUBLIC_TEST = 3;
    EVENT = 4;
    LOCAL = 5;
    PRIVATE = 6;
  }

  string protocol_version = 1;
  string bungee_name = 2;
  string patch_version = 3;
  DFServerType server_type = 4;
}
