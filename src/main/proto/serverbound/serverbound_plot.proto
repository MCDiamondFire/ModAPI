syntax = "proto3";
import "common/data_type.proto";

option java_package = "com.mcdiamondfire.modapi.messages.serverbound.plot";
option java_multiple_files = true;

// Requests to get the template for the code block at the given location,
// if the location is a line starter, the entire line will be returned,
// otherwise only the code block will be returned,
// requires the player to have developer permissions on the plot,
// and the location being a valid line starter.
message GetByLocationOperation {
  APILocation location = 1;
}

// Requests to get the template for the given line starter type and action name,
// requires the player to have developer permissions on the plot,
// and that the code block exists.
message GetByBlockOperation {
  LineStarterBlock type = 1;
  string action = 2;
}

// Requests to place a template at the given location,
// requires the player to have developer permissions on the plot,
// the location being a valid line starter,
// and that the template will not override any blocks nor exit the plot bounds.
message PlaceOperation {
  APILocation location = 1;
  Template template = 2;
}

// Requests to delete the code block at the given location,
// requires the player to have developer permissions on the plot,
// and the location being a valid line starter.
message DeleteByLocationOperation {
  APILocation location = 1;
}

// Requests to delete the code block with the given line starter type and action name,
// requires the player to have developer permissions on the plot,
// and that the code block exists.
message DeleteByBlockOperation {
  LineStarterBlock type = 1;
  string action = 2;
}

// Requests to replace the code block at the given location with the given template,
// requires the player to have developer permissions on the plot,
// the location being a valid line starter,
// and that the template will not override any blocks nor exit the plot bounds (except for the blocks being replaced).
message ReplaceByLocationOperation {
  APILocation location = 1;
  Template template = 2;
}

// Requests to replace the code block with the given line starter type and action name with the given template,
// requires the player to have developer permissions on the plot,
// and that the code block exists,
// and that the template will not override any blocks nor exit the plot bounds (except for the blocks being replaced).
message ReplaceByBlockOperation {
  LineStarterBlock type = 1;
  string action = 2;
  Template template = 3;
}

// Requests to execute a code operation.
// An S2CCodeOperationResult message will be sent as a response, the relevant field will be set depending on the operation requested.
message C2SCodeOperation {
  oneof operation {
    GetByLocationOperation get_by_location = 1;
    GetByBlockOperation get_by_block = 2;
    PlaceOperation place = 3;
    DeleteByLocationOperation delete_by_location = 4;
    DeleteByBlockOperation delete_by_block = 5;
    ReplaceByLocationOperation replace_by_location = 6;
    ReplaceByBlockOperation replace_by_block = 7;
  }
}

// Requests to execute multiple code operations in one message.
// An S2CMultiCodeOperationResult message will be sent as a response, containing the results of all operations requested.
message C2SMultiCodeOperations {
  repeated C2SCodeOperation operations = 1;
}
